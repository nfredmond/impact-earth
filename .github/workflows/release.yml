# Publish only after all native builds and desktop journeys succeed.
name: Release desktop apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx vitest run

      - run: npm run build

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # No Apple signing certificate: ship an ad-hoc-signed build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install Linux package
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ./release/*.deb

      - name: Exercise installed Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs

      - name: Exercise native desktop app
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}
          path: release/desktop-smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Impact Earth $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
