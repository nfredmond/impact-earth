# Builds desktop installers on native runners and attaches them to the GitHub
# Release for the pushed tag: .deb + .AppImage (Linux), .dmg (macOS), .exe (Windows).
name: Release desktop apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run

      - run: npm run build

      - name: Build and publish installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple signing certificate: ship an ad-hoc-signed build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
